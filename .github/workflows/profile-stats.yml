name: Update profile stats

on:
  schedule:
    # 05:17 UTC daily — off-peak, avoids the 0/30-minute stampede
    - cron: '17 5 * * *'
  workflow_dispatch: # manual trigger
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-stats.yml'

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate stats SVG
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const core = require('@actions/core');

            // Pulls from the same data source as github.com/birukmaru's contribution
            // graph. Authenticated via GITHUB_TOKEN, so no rate limits and no third-party
            // service quirks. Includes commits to org repos (Ingenious-Digital-LLC,
            // Tigabu2023, etc.) that github-readme-stats misses.
            const query = `
              query($login: String!) {
                user(login: $login) {
                  contributionsCollection {
                    totalCommitContributions
                    totalPullRequestContributions
                    totalIssueContributions
                    totalRepositoryContributions
                    totalPullRequestReviewContributions
                    contributionCalendar { totalContributions }
                  }
                  repositories(ownerAffiliations: OWNER, isFork: false, first: 1) {
                    totalCount
                  }
                  followers { totalCount }
                  starredRepositories { totalCount }
                }
              }
            `;

            let data;
            try {
              data = await github.graphql(query, { login: 'birukmaru' });
            } catch (err) {
              core.setFailed(`GraphQL fetch failed: ${err.message}`);
              return;
            }

            const u = data.user;
            const c = u.contributionsCollection;

            const stats = {
              contributions: c.contributionCalendar.totalContributions,
              commits: c.totalCommitContributions,
              prs: c.totalPullRequestContributions,
              reviews: c.totalPullRequestReviewContributions,
              issues: c.totalIssueContributions,
              repos: c.totalRepositoryContributions,
              stars: u.starredRepositories.totalCount,
              followers: u.followers.totalCount,
              publicRepos: u.repositories.totalCount,
            };

            const fmt = n => (n || 0).toLocaleString('en-US');

            const card = (label, value, x, y) => `
              <text x="${x}" y="${y}" class="label">${label}</text>
              <text x="${x}" y="${y + 22}" class="value">${fmt(value)}</text>`;

            const svg = `<svg width="495" height="270" xmlns="http://www.w3.org/2000/svg">
<style>
  .c { font-family: 'Segoe UI', -apple-system, system-ui, sans-serif; }
  .title { font-size: 17px; font-weight: 700; fill: #58a6ff; }
  .subtitle { font-size: 11px; fill: #8b949e; }
  .section { font-size: 10px; font-weight: 700; fill: #58a6ff; letter-spacing: 1px; }
  .label { font-size: 10px; fill: #8b949e; letter-spacing: 0.5px; }
  .value { font-size: 20px; font-weight: 700; fill: #c9d1d9; }
</style>
<rect width="495" height="270" fill="#0d1117" rx="8"/>
<text x="25" y="30" class="title c">Biruk Maru's GitHub Stats</text>
<text x="25" y="48" class="subtitle c">Past 12 months · sourced from GitHub GraphQL API</text>
<text x="25" y="80" class="section c">ACTIVITY · LAST 12 MONTHS</text>
${card('CONTRIBUTIONS', stats.contributions, 25, 100)}
${card('COMMITS', stats.commits, 180, 100)}
${card('PULL REQUESTS', stats.prs, 335, 100)}
${card('ISSUES', stats.issues, 25, 150)}
${card('REVIEWS', stats.reviews, 180, 150)}
${card('REPOS TOUCHED', stats.repos, 335, 150)}
<text x="25" y="200" class="section c">LIFETIME</text>
${card('STARS EARNED', stats.stars, 25, 220)}
${card('FOLLOWERS', stats.followers, 180, 220)}
${card('PUBLIC REPOS', stats.publicRepos, 335, 220)}
<text x="25" y="258" class="subtitle c">Updated daily · auto-generated by GitHub Action</text>
</svg>`;

            fs.mkdirSync('profile', { recursive: true });
            fs.writeFileSync('profile/stats.svg', svg);

            // Bust camo cache by stamping today's date on the SVG URL in README.
            const today = new Date().toISOString().split('T')[0];
            const readmePath = 'README.md';
            if (fs.existsSync(readmePath)) {
              const readme = fs.readFileSync(readmePath, 'utf-8');
              const updated = readme.replace(
                /(\/profile\/stats\.svg)(\?v=[0-9-]+)?/,
                `$1?v=${today}`
              );
              if (updated !== readme) {
                fs.writeFileSync(readmePath, updated);
                core.info(`Cache-bust query string updated to v=${today}`);
              }
            }

            core.info('Generated profile/stats.svg');
            core.info(`Stats: ${JSON.stringify(stats)}`);

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: 'profile/stats.svg README.md'
          commit_message: 'chore(profile): refresh stats card'
